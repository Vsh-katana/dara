services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DARA_DATA_DIR: /var/lib/dara
      DARA_SESSION_SECRET_FILE: /run/secrets/dara_session_secret
      FINANCE_SEED_DEFAULT: "0"
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-1}
      MAX_ACCOUNTS: ${MAX_ACCOUNTS:-500}
      COOKIE_SECURE: "1"
    volumes:
      - dara_data:/var/lib/dara
    secrets:
      - dara_session_secret
    expose:
      - "8765"
    networks:
      - dara_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/auth/config',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dara_net
    security_opt:
      - no-new-privileges:true

volumes:
  dara_data:
  caddy_data:
  caddy_config:

secrets:
  dara_session_secret:
    file: ./.secrets/session_secret

networks:
  dara_net:
    driver: bridge
